# Render blueprint for a shareable preview deploy (see README.deploy-preview.md).
# Two services + a free Postgres database, wired together by name.
#
# Deploy: on Render, "New +" -> "Blueprint" -> pick this repo -> Apply.

databases:
  - name: academia-preview-db
    plan: free
    databaseName: academia
    user: academia

services:
  # Django + Channels API (daphne serves both HTTP and the chat websocket).
  - type: web
    name: academia-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed_preview_content
    startCommand: daphne -b 0.0.0.0 -p $PORT api.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: AUTH_COOKIE_DOMAIN
        value: ""
      - key: BACKEND_BASE_URL
        value: https://academia-backend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://academia-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://academia-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://academia-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: academia-preview-db
          property: connectionString

  # Vite/React static build.
  - type: web
    name: academia-frontend
    runtime: static
    plan: free
    region: frankfurt
    rootDir: vite-project
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://academia-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
